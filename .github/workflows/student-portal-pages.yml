name: Student Portal Pages

# Building or pushing a commit never publishes the portal.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified portal to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: student-portal-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-portal
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - name: Validate public authentication configuration
        run: node scripts/check-pages-config.mjs
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: student-portal/dist

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
